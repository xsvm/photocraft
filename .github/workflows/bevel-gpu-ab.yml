name: bevel-gpu-ab
on:
  push:
    branches: [analysis/bevel-ab]
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build A (compose threads) and B (+ shared sharp edges)
        run: |
          mkdir -p bin out
          for v in A B; do
            if [ $v = A ]; then c=027691dcaad38c3ca503f3f29a29db747a200b1a; else c=4813c8c7; fi
            git checkout -q $c
            sed -i 's/^memory-stats = "1.2"$/memory-stats = { version = "1.2", features = ["always_use_statm"] }/' crates/testkit/Cargo.toml
            cargo build --release -p photocraft-ui-egui --locked --example bevel_bench
            git checkout -q -- crates/testkit/Cargo.toml
            cp target/release/examples/bevel_bench bin/bevel_$v
          done
      - name: A/B (interleaved, GPU path, field step traced)
        run: |
          for i in 1 2 3 4 5; do for v in A B; do
            PHOTOCRAFT_FX_TRACE=1 ./bin/bevel_$v --size 4000x3000 --reps 3 --no-cpu --json out/bevel_${v}_$i.json > out/log_${v}_$i.txt 2>&1 || true
          done; done
          python3 - <<'PY'
          import re,glob,statistics as st,collections
          d=collections.defaultdict(list)
          for f in glob.glob('out/log_*_*.txt'):
              v=f.split('_')[1]
              for l in open(f):
                  m=re.search(r"effect maps of `(.{6}).*in ([0-9.]+) ms",l)
                  if m: d[(m.group(1),v)].append(float(m.group(2)))
          for k in sorted(d): print(k, "n",len(d[k]),"median",round(st.median(d[k]),1),"min",min(d[k]),"max",max(d[k]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ab, path: out }
