name: bevel-ab
on:
  push:
    branches: [analysis/bevel-ab]
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev mesa-vulkan-drivers
          nproc; lscpu | grep "Model name"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build A and B, fingerprints
        run: |
          B=027691dc; A=$(git rev-parse $B~1); B=$(git rev-parse $B)
          echo "A=$A B=$B"
          cp .github/fork/fp_test.rs /tmp/fp_test.rs
          mkdir -p bin out
          for v in A B; do
            eval c=\$$v
            git checkout -q $c
            cat /tmp/fp_test.rs >> crates/compose/src/effects.rs
            cargo test --release -q -p photocraft-compose --lib fork_bevel_fingerprint -- --nocapture 2>&1 | grep FORK_FP | sed "s/^/$v /" | tee -a out/fp.txt
            git checkout -q -- crates/compose/src/effects.rs
            sed -i 's/^memory-stats = "1.2"$/memory-stats = { version = "1.2", features = ["always_use_statm"] }/' crates/testkit/Cargo.toml
            grep -n memory-stats crates/testkit/Cargo.toml
            cargo build --release -p photocraft-ui-egui --locked --example bevel_bench
            git checkout -q -- crates/testkit/Cargo.toml
            cp target/release/examples/bevel_bench bin/bevel_$v
          done
          echo "== fingerprints"; cat out/fp.txt
          [ "$(cut -d' ' -f3 out/fp.txt | sort -u | wc -l)" = 1 ] && echo "FINGERPRINTS EQUAL" || { echo "FINGERPRINTS DIFFER"; exit 1; }
      - name: A/B runs (interleaved)
        run: |
          for i in 1 2 3 4 5 6; do for v in A B; do
            ./bin/bevel_$v --size 4000x3000 --reps 3 --json out/bevel_${v}_$i.json > out/bevel_${v}_$i.log 2>&1 || true
          done; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ab, path: out }
