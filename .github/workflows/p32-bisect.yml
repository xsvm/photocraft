name: p32-bisect
# One-off: which commit between 2d2e4993 (10-14, release 0.33 ms) and main (7.6 ms) slowed the
# P32 brush release on Linux? Engine-only bench (.github/ab/p32_release.rs), git bisect run.
on:
  push:
    branches: [analysis/p32-bisect]
jobs:
  bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Bisect
        run: |
          set -u
          cp .github/ab/p32_release.rs /tmp/p32_release.rs
          cat > /tmp/step.sh <<'SH'
          #!/bin/bash
          cp /tmp/p32_release.rs crates/engine/examples/p32_release.rs
          if ! cargo build -q --release -p photocraft-engine --example p32_release 2>/tmp/build.err; then
            rm -f crates/engine/examples/p32_release.rs; tail -3 /tmp/build.err; exit 125
          fi
          rm -f crates/engine/examples/p32_release.rs
          out=$(target/release/examples/p32_release); code=$?
          echo "$(git log -1 --format='%h %s' | cut -c1-90) :: $out"
          exit $code
          SH
          chmod +x /tmp/step.sh
          main=$(git rev-parse HEAD~1)
          git checkout -q "$main"
          echo "== endpoints"
          git checkout -q 2d2e4993 && /tmp/step.sh; echo "old exit $?"
          git checkout -q "$main" && /tmp/step.sh; echo "main exit $?"
          git bisect start "$main" 2d2e4993 --first-parent
          git bisect run /tmp/step.sh 2>&1 | grep -E '::|is the first bad commit|^commit |^    ' | tee bisect.txt
          git bisect log | tail -5
          { echo '```'; cat bisect.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
