name: subject-aa-ab2
# One-off for storytold/photocraft#8554 (after the edge_value refactor): clippy and the algo unit tests (debug) at the PR head,
# then a first Select Subject on 24 MP, main vs PR, both with the analysis branch's stage timings.
on:
  push:
    branches: [analysis/subject-aa-ab2]
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy and unit tests at the PR head
        run: |
          git fetch -q origin analysis/subject-profile
          git checkout -q HEAD~1
          git log --oneline -1
          cargo clippy -q -p photocraft-algo --all-targets --locked -- -D warnings
          cargo test -q -p photocraft-algo --lib --locked segment 2>&1 | tail -5
      - name: Build main and PR (release, instrumented)
        run: |
          git worktree add -q ../m FETCH_HEAD
          git worktree add -q ../p "$GITHUB_SHA"
          for d in m p; do
            (cd ../$d && git log --oneline -1 && CARGO_TARGET_DIR=$PWD/../t-$d cargo test -q --release -p photocraft-algo --lib --locked --no-run)
          done
      - name: A/B
        run: |
          set -u
          nproc
          bin() { ls -t ../t-$1/release/deps/photocraft_algo-* | grep -v '\.d$' | head -1; }
          cmp "$(bin m)" "$(bin p)" >/dev/null && { echo "binaries identical"; exit 1; }
          {
            for round in 1 2 3; do
              for d in m p; do
                echo "== round $round $d"
                SUBJECT_REPS=3 $(bin $d) --ignored --exact --nocapture segment::tests::subject_profile_24mp 2>&1 | grep -E 'antialias|finish_region|select_subject 24'
                $(bin $d) --ignored --exact --nocapture segment::tests::select_subject_timing 2>&1 | grep 'select_subject 6'
              done
            done
          } | tee out.txt
          { echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
