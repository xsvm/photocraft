name: gradient-bisect
# One-off: does the live-gradient refresh regression (perf runner: drag update min 24 -> 74 ms
# between 2d2e4993 and 03d0c7e3) reproduce on Linux, on lavapipe and on the CPU compositor?
on:
  push:
    branches: [analysis/gradient-bisect]
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev mesa-vulkan-drivers
      - name: Build A (2d2e4993) and B (03d0c7e3)
        run: |
          set -eu
          export CARGO_TARGET_DIR="$PWD/target-ab"
          for side in A:2d2e4993 B:03d0c7e3; do
            name=${side%%:*}; rev=${side#*:}
            git worktree add -q "wt-$name" "$rev"
            (cd "wt-$name" && cargo build -q --release -p photocraft-ui-egui --example interactive_bench)
            cp "$CARGO_TARGET_DIR/release/examples/interactive_bench" "bench-$name"
          done
      - name: Run interleaved
        run: |
          set -u
          for mode in gpu cpu; do
            extra=""; [ "$mode" = cpu ] && extra="--cpu"
            for round in 1 2 3; do
              for side in A B; do
                echo "== $mode $side round $round"
                ./bench-$side --size 4000x3000 --reps 7 --only "live gradient" $extra 2>&1 | grep -iE "gradient|gpu|adapter|fallback" | head -8
              done
            done
          done | tee ab.txt
          { echo '```'; cat ab.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
