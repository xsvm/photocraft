name: ab-1020
# One-off, two questions on Linux (ubuntu, lavapipe):
# 1. #7930 against the latest main: P30 update time and bit-identical output (liq_bench).
# 2. Do the P27 / P32 slowdowns the macOS perf runner showed between 2d2e4993 (10-14) and the
#    latest main reproduce here (perf_scenarios rows)?
on:
  push:
    branches: [analysis/ab-1020]
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev mesa-vulkan-drivers
      - name: Worktrees (O = 10-14, M = main, P = main + #7930)
        run: |
          set -eu
          M=$(git rev-parse HEAD~1)
          git worktree add -q wt-O 2d2e4993
          git worktree add -q wt-M "$M"
          git worktree add -q wt-P "$M"
          git -C wt-P -c user.name=ab -c user.email=ab@invalid merge -q --no-edit 3db8cc1b
          git -C wt-P log --oneline -3
      - name: Liquify (M vs P)
        run: |
          set -eu
          export CARGO_TARGET_DIR="$PWD/target-ab"
          for side in M P; do
            cp .github/ab/liq_bench.rs "wt-$side/crates/algo/examples/liq_bench.rs"
            (cd "wt-$side" && cargo build -q --release -p photocraft-algo --example liq_bench)
            cp "$CARGO_TARGET_DIR/release/examples/liq_bench" "liq-$side"
          done
          nproc
          for mode in flat tex; do
            for round in 1 2 3 4 5; do
              for side in M P; do echo "$side round $round: $(./liq-$side $mode)"; done
            done
          done | tee liq.txt
          { echo '### Liquify M vs P'; echo '```'; cat liq.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Scorecard rows (O vs M vs P)
        run: |
          set -eu
          export CARGO_TARGET_DIR="$PWD/target-ab"
          for side in O M P; do
            (cd "wt-$side" && cargo build -q --release -p photocraft-ui-egui --example perf_scenarios)
            cp "$CARGO_TARGET_DIR/release/examples/perf_scenarios" "perf-$side"
          done
          for row in "Feather r 50 on 24 MP" "brush release" "Liquify 800 px"; do
            for round in 1 2 3; do
              for side in O M P; do
                echo "== $side round $round: $row"
                ./perf-$side --reps 7 --only "$row" 2>&1 | grep -vE '^\s*$' | tail -4
              done
            done
          done | tee rows.txt
          { echo '### Scorecard rows'; echo '```'; cat rows.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
