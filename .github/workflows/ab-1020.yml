name: ab-1020
# One-off on Linux (ubuntu): #7930 against the latest main: P30 update time and bit-identical output (liq_bench).
on:
  push:
    branches: [analysis/ab-1020]
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Worktrees (M = main, P = main + #7930)
        run: |
          set -eu
          M=$(git rev-parse HEAD~1)
          git worktree add -q wt-M "$M"
          git worktree add -q wt-P "$M"
          git -C wt-P -c user.name=ab -c user.email=ab@invalid merge -q --no-edit 3db8cc1b
          git -C wt-P log --oneline -3
      - name: Liquify (M vs P)
        run: |
          set -eu
          # One target dir per side: a shared one reuses M's build for P (P's worktree files
          # are older than M's outputs, so cargo sees them as fresh).
          for side in M P; do
            cp .github/ab/liq_bench.rs "wt-$side/crates/algo/examples/liq_bench.rs"
            (cd "wt-$side" && CARGO_TARGET_DIR="$PWD/../target-$side" cargo build -q --release -p photocraft-algo --example liq_bench)
            cp "target-$side/release/examples/liq_bench" "liq-$side"
          done
          if cmp -s liq-M liq-P; then echo "M and P binaries are identical"; exit 1; fi
          nproc
          for mode in flat tex; do
            for round in 1 2 3 4 5; do
              for side in M P; do echo "$side round $round: $(./liq-$side $mode)"; done
            done
          done | tee liq.txt
          { echo '### Liquify M vs P'; echo '```'; cat liq.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
