name: cpu-hotspots
# One-off: CPU hot spots across the scorecard on Linux (CPU compositor, so every frame is
# profiled code, not llvmpipe's JIT): one perf profile per perf_scenarios group and one of
# interactive_bench, top self-time symbols each.
on:
  push:
    branches: [analysis/cpu-hotspots]
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: System dependencies and perf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev linux-tools-common "linux-tools-$(uname -r)"
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
      - name: Build (release, line tables)
        run: CARGO_PROFILE_RELEASE_DEBUG=line-tables-only cargo build -q --release -p photocraft-ui-egui --example perf_scenarios --example interactive_bench
      - name: Profiles
        run: |
          set -u
          ex=target/release/examples
          top() { perf report -i "$1" --no-children --sort symbol --percent-limit 1.5 --stdio -g none 2>/dev/null | grep -E '^ +[0-9]' | head -18; }
          for g in "layered" "many layers" "bit depths" "algorithms"; do
            echo "== group: $g"
            perf record -q -F 999 -g -o p.data -- $ex/perf_scenarios --cpu --group "$g" --reps 3 2>&1 | grep -E ' p50 ' | sed 's/  */ /g' | cut -c1-110
            top p.data
          done
          echo "== interactive_bench"
          perf record -q -F 999 -g -o p.data -- $ex/interactive_bench --cpu --size 4000x3000 --reps 3 2>&1 | grep -E 'ms' | sed 's/  */ /g' | cut -c1-110
          top p.data
        shell: bash
