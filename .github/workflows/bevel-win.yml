name: bevel-win
on:
  push:
    branches: [analysis/bevel-ab]
jobs:
  compose:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: compose tests at the PR commit
        shell: bash
        run: |
          git checkout -q 027691dcaad38c3ca503f3f29a29db747a200b1a
          cargo test -p photocraft-compose --locked --no-fail-fast 2>&1 | tee test.log | grep -E "test result|FAILED|bevel_maps_do_not_depend|chisel_fields_do_not_depend"
