name: mcp-utf8
# One-off check for fix/mcp-stdio-invalid-utf8 (977f2657): photocraft-automation tests and
# clippy in debug on the fix, and the new regression test alone on main (must fail there).
on:
  push:
    branches: [analysis/mcp-utf8]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: automation tests on the fix (debug)
        shell: bash
        run: |
          set -o pipefail
          git worktree add -q wt-fix 977f2657
          cd wt-fix && CARGO_TARGET_DIR="$PWD/../target" cargo test -q -p photocraft-automation 2>&1 | grep -E 'test result|FAILED|panicked|failures|error' 
      - name: clippy on the fix
        shell: bash
        run: cd wt-fix && CARGO_TARGET_DIR="$PWD/../target" cargo clippy -q -p photocraft-automation --all-targets -- -D warnings
      - name: the new test alone on main (expected to fail)
        shell: bash
        run: |
          set -u
          git worktree add -q wt-main 68348dca
          f=crates/automation/src/server/transport.rs
          sed -i '$ d' "wt-main/$f"
          git show "977f2657:$f" | sed -n '/async fn next_reply/,$p' | sed '1i\    async fn next_reply_marker() {}' >> "wt-main/$f"
          cd wt-main
          if CARGO_TARGET_DIR="$PWD/../target" cargo test -q -p photocraft-automation --lib a_line_that_is_not_utf8 2>&1 | tail -15; then
            echo "UNEXPECTED: passes on main"; exit 1
          else
            echo "fails on main as expected"
          fi
