name: bevel-gpu-probe
on:
  push:
    branches: [analysis/bevel-ab]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTFLAGS: -C force-frame-pointers=yes
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev mesa-vulkan-drivers linux-tools-common linux-tools-$(uname -r) || \
          sudo apt-get install -y --no-install-recommends linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build (PR commit + statm)
        run: |
          git checkout -q 027691dcaad38c3ca503f3f29a29db747a200b1a
          sed -i 's/^memory-stats = "1.2"$/memory-stats = { version = "1.2", features = ["always_use_statm"] }/' crates/testkit/Cargo.toml
          cargo build --release -p photocraft-ui-egui --locked --example bevel_bench
      - name: trace
        run: |
          mkdir -p out
          PHOTOCRAFT_FX_TRACE=1 target/release/examples/bevel_bench --size 4000x3000 --reps 3 --no-cpu 2>&1 | tee out/trace.txt | grep -v "^effect maps" ; grep "^effect maps" out/trace.txt | head -60
      - name: profile
        run: |
          PERF=$(command -v perf || ls /usr/lib/linux-tools/*/perf | head -1)
          $PERF record -F 999 -g --call-graph fp -o out/g.data -- target/release/examples/bevel_bench --size 4000x3000 --reps 3 --no-cpu > /dev/null 2>&1 || true
          echo "== comm"; $PERF report -i out/g.data --no-children --sort comm --stdio 2>/dev/null | grep -E '^ +[0-9]' | head
          echo "== self (not llvmpipe)"; $PERF report -i out/g.data --comms bevel_bench --no-children --sort symbol --stdio --percent-limit 0.7 2>/dev/null | grep -E '^ +[0-9]' | cut -c1-150 | head -45
          echo "== children (not llvmpipe)"; $PERF report -i out/g.data --comms bevel_bench --children --sort symbol --stdio --percent-limit 2 -g none 2>/dev/null | grep -E '^ +[0-9]' | cut -c1-150 | head -60
          rm -f out/g.data
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe, path: out }
